name: Release

# Push a tag like v0.4.2 (matching both package.json versions) to build, sign, notarize and publish a release.
# Run it by hand (Actions → Release → Run workflow) for a dry run: everything except publishing; the assets are
# kept as a workflow artifact instead.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install
        run: bun install --frozen-lockfile
      - name: Version
        id: version
        run: |
          v=$(node -p 'require("./package.json").version')
          test "$(node -p 'require("./desktop/package.json").version')" = "$v"
          if [ "$GITHUB_EVENT_NAME" = push ]; then test "${GITHUB_REF_NAME#v}" = "$v"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Test
        run: bun run typecheck && bun test

  build-mac:
    needs: check
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, x64]
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install
        run: |
          bun install --frozen-lockfile
          (cd desktop && bun install --frozen-lockfile)
      - name: Write the notarization key to a file
        # electron-builder 26 hands APPLE_API_KEY to notarytool as a path, so the base64 secret becomes a temp file
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf %s "$APPLE_API_KEY_BASE64" | base64 --decode > "$key"
          chmod 600 "$key"
          echo "APPLE_API_KEY_FILE=$key" >> "$GITHUB_ENV"
      - name: Build, sign and notarize the app (it bundles the macOS CLI)
        working-directory: desktop
        env:
          # Developer ID Application certificate + key (.p12, base64) and its password
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ env.APPLE_API_KEY_FILE }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          bun run cli
          npx electron-vite build
          npx electron-builder --mac zip --${{ matrix.arch }} --publish never --config electron-builder.yml
      - name: Check the app is signed, notarized and stapled
        working-directory: desktop
        run: |
          for app in dist/mac*/"Skill Manager.app"; do
            codesign --verify --deep --strict "$app"
            spctl --assess --type execute -vv "$app"
            xcrun stapler validate "$app"
          done
      - name: Sign and notarize the standalone CLI
        working-directory: desktop
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ env.APPLE_API_KEY_FILE }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          sh scripts/sign-cli.sh ../dist/skm-darwin-${{ matrix.arch }}
          codesign -dv --verbose=2 ../dist/skm-darwin-${{ matrix.arch }} 2>&1 | grep -E '^(Authority=Developer ID Application|TeamIdentifier)'
      - uses: actions/upload-artifact@v7
        with:
          name: mac-${{ matrix.arch }}
          path: |
            desktop/dist/skill-manager-${{ env.VERSION }}-${{ matrix.arch }}-mac.zip
            dist/skm-darwin-${{ matrix.arch }}
          if-no-files-found: error

  publish:
    needs: [check, build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
      id-token: write      # build provenance
      attestations: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install
        run: bun install --frozen-lockfile
      - name: Build the CLI for Linux
        run: bun run build:linux
      - uses: actions/download-artifact@v8
        with:
          pattern: mac-*
          path: mac
          merge-multiple: true
      - name: Sign the update manifest
        env:
          SKM_UPDATE_SIGN_KEY: ${{ secrets.SKM_UPDATE_SIGN_KEY }}
        run: |
          mkdir -p desktop/dist
          bun desktop/scripts/update-manifest.ts "$VERSION" mac/desktop/dist/skill-manager-"$VERSION"-*-mac.zip
      - name: Collect assets
        run: |
          mkdir release
          cp mac/desktop/dist/skill-manager-"$VERSION"-*-mac.zip desktop/dist/latest-mac.json desktop/dist/latest-mac.json.sig release/
          for t in darwin-arm64 darwin-x64; do cp "mac/dist/skm-$t" "release/skm-$t"; done
          for t in linux-x64 linux-arm64; do cp "dist/skm-$t" "release/skm-$t"; done
          (cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS)
          sh scripts/release-notes.sh "$VERSION" > notes.md
          cat notes.md
      - name: Keep the assets (dry run)
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ env.VERSION }}-dry-run
          path: |
            release/
            notes.md
      - uses: actions/attest-build-provenance@v4
        if: github.event_name == 'push'
        with:
          subject-path: release/*
      - name: Publish
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s notes.md ]; then
            gh release create "$GITHUB_REF_NAME" release/* --title "Skill Manager $VERSION" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" release/* --title "Skill Manager $VERSION" --generate-notes
          fi
