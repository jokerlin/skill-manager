<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#0E7490"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>
  <!-- full-bleed: macOS 26 masks legacy icons to its own squircle; transparent margins would get a white backing plate -->
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#sheen)"/>
  <!-- three stacked skill layers, bottom to top -->
  <g transform="translate(512 512) scale(1.18)" stroke="#ffffff" stroke-width="44" stroke-linejoin="round" filter="url(#shadow)">
    <polygon points="0,-118 262,22 0,162 -262,22" transform="translate(0 160)" fill="#ffffff" opacity="0.42"/>
    <polygon points="0,-118 262,22 0,162 -262,22" transform="translate(0 40)" fill="#ffffff" opacity="0.68"/>
    <polygon points="0,-118 262,22 0,162 -262,22" transform="translate(0 -80)" fill="#ffffff"/>
  </g>
  <!-- linked dot on the top layer -->
  <circle cx="512" cy="443" r="60" fill="#22C55E" stroke="#ffffff" stroke-width="16"/>
</svg>
