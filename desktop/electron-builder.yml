appId: dev.skm.app
productName: Skill Manager
copyright: Copyright © 2026 jokerlin
artifactName: skill-manager-${version}-${arch}-mac.${ext}
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
# the skm CLI the app drives, built per architecture by `bun run build:mac` in the repo root
extraResources:
  - from: ../dist/skm-darwin-${arch}
    to: bin/skm
asar: true
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  target:
    - dir
  # Signed with the Developer ID from CSC_LINK / CSC_KEY_PASSWORD and notarized when APPLE_API_KEY,
  # APPLE_API_KEY_ID and APPLE_API_ISSUER are set (the Release workflow); a build without them is unsigned.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    LSMinimumSystemVersion: "13.0"
