<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Skill Manager: a host × agent grid; green spreads from one source cell, the way skm syncs one store to every machine and agent -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#2A2F37"/>
      <stop offset="1" stop-color="#121418"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6BE3A3"/>
      <stop offset="1" stop-color="#34B573"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.3" r="0.55">
      <stop offset="0" stop-color="#3FBF7F" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3FBF7F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- full-bleed: macOS 26 masks legacy icons to its own squircle; transparent margins would get a white backing plate -->
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#glow)"/>
  <rect x="6" y="6" width="1012" height="1012" rx="226" fill="none" stroke="url(#rim)" stroke-width="12"/>
  <rect x="202" y="202" width="176" height="176" rx="44" fill="url(#lit)" opacity="1.0"/>
  <rect x="424" y="202" width="176" height="176" rx="44" fill="#3FBF7F" opacity="0.82"/>
  <rect x="646" y="202" width="176" height="176" rx="44" fill="#3FBF7F" opacity="0.46"/>
  <rect x="202" y="424" width="176" height="176" rx="44" fill="#3FBF7F" opacity="0.82"/>
  <rect x="424" y="424" width="176" height="176" rx="44" fill="#3FBF7F" opacity="0.46"/>
  <rect x="646" y="424" width="176" height="176" rx="44" fill="#FFFFFF" opacity="0.13"/>
  <rect x="202" y="646" width="176" height="176" rx="44" fill="#3FBF7F" opacity="0.46"/>
  <rect x="424" y="646" width="176" height="176" rx="44" fill="#FFFFFF" opacity="0.13"/>
  <rect x="646" y="646" width="176" height="176" rx="44" fill="#FFFFFF" opacity="0.08"/>
</svg>
